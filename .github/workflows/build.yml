name: Zbuduj moda

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.9.0

      - name: Wyslij gotowy plik .geode
        uses: actions/upload-artifact@v4
        with:
          name: gotowy-mod
          path: build/*.geode
          if-no-files-found: error
